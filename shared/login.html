<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Dashboard - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-white h-screen flex overflow-hidden">

    <div class="hidden lg:flex lg:w-1/2 flex-col h-full">
        <div class="flex-1 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1522071820081-009f0129c71c?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80');">
            <div class="h-full w-full flex flex-col justify-end">
                <div class="h-1 bg-emerald-500 w-full"></div>
            </div>
        </div>
        
        <div class="bg-[#151c2c] text-white px-12 py-16 h-2/5 flex flex-col justify-center">
            <div class="flex items-center gap-2 mb-6 font-bold text-xl">
                <div class="w-6 h-6 bg-emerald-500 rounded flex items-center justify-center text-white">H</div>
                HRDashboard
            </div>
            
            <h1 class="text-4xl font-bold mb-4 leading-tight">
                Let's empower your<br>employees today.
            </h1>
            <p class="text-gray-400 text-sm">
                We help to complete all your conveyancing needs easily
            </p>
        </div>
    </div>

    <div class="w-full lg:w-1/2 flex flex-col relative overflow-y-auto">
        
        <div class="flex-1 flex flex-col justify-center items-center px-8 py-12">
            <div class="w-full max-w-md">
                
                <div class="text-center mb-10">
                    <div class="absolute top-16 left-1/4 hidden md:block text-gray-200">
                        <svg width="60" height="60" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M10 10 Q 50 10 90 50" stroke="currentColor" stroke-width="2" fill="transparent"/>
                            <path d="M75 50 L 90 50 L 85 35" stroke="currentColor" stroke-width="2" fill="transparent"/>
                        </svg>
                    </div>
                    
                    <h2 class="text-2xl font-bold text-gray-800">Login first to your account</h2>
                </div>

                <form action="#" method="POST" class="space-y-5">
                    
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">
                            Email Address <span class="text-red-500">*</span>
                        </label>
                        <input type="email" id="email" placeholder="Input your registered email" 
                               class="w-full px-4 py-3 rounded-lg border border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 text-sm">
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">
                            Password <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <input type="password" id="password" placeholder="Input your password account" 
                                   class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:border-gray-300 text-sm text-gray-600">
                            <button type="button" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-gray-600">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between mt-4">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" class="rounded border-gray-300 text-emerald-500 focus:ring-emerald-500 w-4 h-4">
                            <span class="text-sm text-gray-500">Remember Me</span>
                        </label>
                        <a href="#" class="text-sm text-gray-500 hover:text-gray-800">Forgot Password</a>
                    </div>

                    <button type="button" class="w-full bg-gray-100 text-slate-400 font-medium py-3 rounded-lg mt-6 hover:bg-gray-200 transition">
                        Login
                    </button>

                </form>

                <div class="relative flex items-center py-8">
                    <div class="flex-grow border-t border-gray-100"></div>
                    <span class="flex-shrink-0 mx-4 text-gray-400 text-sm">Or login with</span>
                    <div class="flex-grow border-t border-gray-100"></div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <button class="flex items-center justify-center gap-2 border border-gray-200 rounded-lg py-2.5 hover:bg-gray-50 transition">
                        <svg class="w-5 h-5" viewBox="0 0 24 24">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.16v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.16C1.43 8.55 1 10.22 1 12s.43 3.45 1.16 4.93l3.68-2.84z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.16 7.07l3.68 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </svg>
                        <span class="text-sm font-medium text-gray-700">Google</span>
                    </button>
                    
                    <button class="flex items-center justify-center gap-2 border border-gray-200 rounded-lg py-2.5 hover:bg-gray-50 transition">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="black">
                            <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.04 2.26-.74 3.58-.79 1.56-.06 2.85.66 3.65 1.83-3.12 1.93-2.6 5.96.47 7.21-.72 1.76-1.55 3.37-2.78 4.92zm-3.83-14c.2-1.6 1.05-3.05 2.37-4.05-1.28-1.57-3.32-1.74-3.92-1.76-.23 1.53-.94 2.97-2.18 4.02-1.12 1.01-2.65 1.4-3.83 1.34.2 1.63 1.14 3 2.38 3.96 1.03.88 2.38 1.43 3.62 1.39.06-1.72-.65-3.24-1.85-4.22z"/>
                        </svg>
                        <span class="text-sm font-medium text-gray-700">Apple</span>
                    </button>
                </div>

                <p class="text-center text-sm mt-8 text-gray-400">
                    You're new in here? <a href="#" class="text-emerald-500 font-medium hover:underline">Create Account</a>
                </p>

            </div>
        </div>

        <div class="w-full text-center py-6 text-xs text-gray-400 mt-auto shrink-0">
            © 2025 HRDashboard. Allrights reserved. <a href="#" class="text-gray-600 hover:underline mx-1">Terms & Conditions</a> <a href="#" class="text-gray-600 hover:underline mx-1">Privacy Policy</a>
        </div>

    </div>

</body>
</html>
